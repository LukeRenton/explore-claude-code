name: Validate content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Zero dependencies: the validator is plain Node, no install step.
      - name: Validate manifest and content
        run: node scripts/validate-content.js
